<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guitarra</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Guitarra</h1>
      <div class="picker">
        <label for="routine" class="muted">Routine</label>
        <select id="routine"></select>
      </div>
      <p id="routine-summary" class="summary"></p>
      <div class="bar"><div id="progress"></div></div>
      <p id="total-left" class="muted"></p>
    </header>

    <main>
      <section class="card now">
        <p id="step-num" class="muted"></p>
        <h2 id="step-title"></h2>
        <div id="step-time" class="time">0:00</div>
        <div class="controls">
          <button id="prev" aria-label="Previous step">◀</button>
          <button id="start" class="primary">Start</button>
          <button id="next" aria-label="Next step">▶</button>
        </div>
        <div id="blocks"></div>

        <div id="finished" hidden>
          <h3>Session done. Nice work.</h3>
          <p>Your result is saved in the practice log. Come back tomorrow and try to beat your scores.</p>
          <button id="restart">Start over</button>
        </div>
      </section>

      <section class="card metro">
        <h2>Metronome</h2>
        <div class="bpm-row">
          <button data-bpm="-5">−5</button>
          <button data-bpm="-1">−1</button>
          <div><span id="bpm">70</span> <small>BPM</small></div>
          <button data-bpm="1">+1</button>
          <button data-bpm="5">+5</button>
        </div>
        <div class="beats"><span class="beat"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span></div>
        <button id="metro-toggle">Start</button>
        <label class="muted"><input type="checkbox" id="auto-metro" checked /> Set tempo and start/stop automatically for each step</label>
      </section>

      <section class="card">
        <h2>Steps</h2>
        <ol id="steps" class="steps"></ol>
      </section>

      <section class="card">
        <h2>Practice log</h2>
        <ul id="history" class="history"></ul>
      </section>

      <section class="card">
        <h2>Coming up on the road to Blackbird</h2>
        <ul id="roadmap" class="history"></ul>
      </section>
    </main>

    <footer class="muted">Space: start/pause, or count a change · M: metronome</footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
